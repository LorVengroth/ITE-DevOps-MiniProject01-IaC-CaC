
---
- name: Install Nexus Repository
  hosts: nexus
  become: true

  tasks:
    - name: Run Nexus container
      community.docker.docker_container:
        name: nexus
        image: sonatype/nexus3:latest
        state: started
        restart_policy: unless-stopped
        ports:
          - "8081:8081"
        volumes:
          - "nexus_data:/nexus-data"
